name: Build Windows release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish src/LooyWindowsController/LooyWindowsController.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output dist/win-x64 `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true
          Copy-Item README_CN.md dist/win-x64/使用说明.md
          Compress-Archive -Path dist/win-x64/* -DestinationPath dist/LooyWindowsController-win-x64.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found: $iscc"
          }
          & $iscc installer/LooyWindowsController.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: LooyWindowsController-Windows-v0.1.1
          path: |
            dist/LooyWindowsController-win-x64.zip
            dist/installer/LooyWindowsController-Setup-0.1.1.exe
          if-no-files-found: error
